name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Skill Validation
    uses: netresearch/skill-repo-skill/.github/workflows/validate.yml@main
    with:
      # Same level as the pre-commit shellcheck hook, which runs at its
      # default (style).
      shellcheck-severity: style
